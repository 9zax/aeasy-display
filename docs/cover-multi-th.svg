<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system,'SF Pro Display','Segoe UI','Noto Sans Thai','Leelawadee UI',Thonburi,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="aurora" x1="700" y1="150" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="scr1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="scr3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blob" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B1220"/>
  <circle cx="180" cy="-40" r="280" fill="#6366F1" opacity="0.20" filter="url(#blob)"/>
  <circle cx="1160" cy="700" r="300" fill="#06B6D4" opacity="0.16" filter="url(#blob)"/>

  <!-- brand row -->
  <g transform="translate(80,56) scale(0.117)">
    <rect width="512" height="512" rx="116" fill="#1E1B4B"/>
    <g filter="url(#glow)" opacity="0.65">
      <rect x="108" y="144" width="208" height="132" rx="6" fill="url(#aurora)"/>
      <rect x="340" y="186" width="90" height="190" rx="14" fill="url(#aurora)"/>
    </g>
    <path d="M212,304 C212,368 300,402 340,402 C368,402 386,400 386,388" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
    <rect x="96" y="132" width="232" height="156" rx="14" fill="#E2E8F0"/>
    <rect x="108" y="144" width="208" height="132" rx="6" fill="#6366F1"/>
    <rect x="76" y="288" width="272" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="330" y="176" width="110" height="210" rx="22" fill="#E2E8F0"/>
    <rect x="340" y="186" width="90" height="190" rx="14" fill="#8B5CF6"/>
  </g>
  <text x="156" y="96" font-size="28" font-weight="600" fill="#E2E8F0">AEasy Display</text>

  <!-- headline -->
  <text x="80" y="230" font-size="52" font-weight="800" fill="#F8FAFC">มือถือเก่า 3 เครื่อง</text>
  <text x="80" y="298" font-size="52" font-weight="800" fill="url(#accent)">กลายเป็นจอ Mac 3 จอ</text>

  <!-- subline -->
  <text x="80" y="358" font-size="22" fill="#94A3B8">เพิ่มหรือถอดเครื่องได้เลย เครื่องอื่นไม่สะดุด</text>
  <text x="80" y="392" font-size="22" fill="#94A3B8">แต่ละเครื่องมีจอ pane และความละเอียดของตัวเอง</text>

  <!-- pills -->
  <g font-size="18" fill="#CBD5E1">
    <rect x="80" y="436" width="200" height="42" rx="21" fill="#131C2E" stroke="#334155"/>
    <text x="180" y="464" text-anchor="middle">ต่อพร้อมกัน 3 เครื่อง</text>
    <rect x="296" y="436" width="176" height="42" rx="21" fill="#131C2E" stroke="#334155"/>
    <text x="384" y="464" text-anchor="middle">USB-C หรือ Wi-Fi</text>
    <rect x="488" y="436" width="150" height="42" rx="21" fill="#131C2E" stroke="#334155"/>
    <text x="563" y="464" text-anchor="middle">แตะ = คลิก</text>
  </g>

  <!-- install -->
  <rect x="80" y="500" width="404" height="46" rx="10" fill="#0F1729" stroke="#1E293B"/>
  <text x="100" y="530" font-size="18" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#7DD3FC">brew install 9zax/tap/aeasy-display</text>

  <text x="80" y="588" font-size="17" fill="#64748B">macOS 13+ · Android 8+ · iPhone &amp; iPad (beta) · ฟรีและโอเพนซอร์ส</text>

  <!-- ============ illustration ============ -->
  <g>
    <!-- glow behind the screens -->
    <g filter="url(#glow)" opacity="0.5">
      <rect x="716" y="168" width="272" height="170" rx="8" fill="url(#aurora)"/>
      <rect x="713" y="410" width="80" height="152" rx="14" fill="url(#scr1)"/>
      <rect x="844" y="402" width="124" height="164" rx="10" fill="url(#scr2)"/>
      <rect x="1023" y="410" width="74" height="152" rx="16" fill="url(#scr3)"/>
    </g>

    <!-- MacBook -->
    <rect x="702" y="154" width="300" height="198" rx="16" fill="#E2E8F0"/>
    <rect x="716" y="168" width="272" height="170" rx="8" fill="url(#aurora)"/>
    <!-- three windows on the Mac, one per device -->
    <g opacity="0.9">
      <rect x="734" y="188" width="86" height="60" rx="5" fill="#0F172A" fill-opacity="0.45" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="734" y="188" width="86" height="8" rx="4" fill="#F8FAFC" fill-opacity="0.35"/>
      <rect x="836" y="212" width="92" height="64" rx="5" fill="#0F172A" fill-opacity="0.45" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="836" y="212" width="92" height="8" rx="4" fill="#F8FAFC" fill-opacity="0.35"/>
      <rect x="762" y="266" width="88" height="56" rx="5" fill="#0F172A" fill-opacity="0.45" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="762" y="266" width="88" height="8" rx="4" fill="#F8FAFC" fill-opacity="0.35"/>
    </g>
    <rect x="674" y="352" width="356" height="18" rx="9" fill="#CBD5E1"/>
    <rect x="822" y="352" width="60" height="8" rx="4" fill="#94A3B8"/>

    <!-- fan-out links, drawn after the base so they emerge from under it and tuck
         behind the devices: one Mac feeding three independent displays -->
    <g fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round">
      <path d="M786,366 C778,384 762,386 753,400"/>
      <path d="M866,366 C878,378 896,380 906,392"/>
      <path d="M948,366 C1000,378 1040,382 1060,400"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="766" cy="382" r="3.5"/>
      <circle cx="888" cy="381" r="3.5"/>
      <circle cx="1014" cy="381" r="3.5"/>
    </g>

    <!-- device 1 — Android phone, holds Mac input -->
    <rect x="702" y="398" width="102" height="176" rx="22" fill="#E2E8F0"/>
    <rect x="713" y="410" width="80" height="152" rx="14" fill="url(#scr1)"/>
    <circle cx="753" cy="422" r="3.5" fill="#0F172A" fill-opacity="0.55"/>
    <rect x="720" y="440" width="44" height="32" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="738" y="486" width="48" height="34" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>
    <!-- touch ripple: this is the device driving the cursor -->
    <circle cx="762" cy="534" r="11" fill="none" stroke="#22D3EE" stroke-width="2.2"/>
    <circle cx="762" cy="534" r="3.5" fill="#22D3EE"/>

    <!-- device 2 — tablet -->
    <rect x="832" y="390" width="148" height="188" rx="16" fill="#E2E8F0"/>
    <rect x="844" y="402" width="124" height="164" rx="10" fill="url(#scr2)"/>
    <rect x="854" y="416" width="58" height="44" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="890" y="474" width="66" height="48" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="854" y="474" width="28" height="48" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>

    <!-- device 3 — iPhone -->
    <rect x="1012" y="398" width="96" height="176" rx="24" fill="#E2E8F0"/>
    <rect x="1023" y="410" width="74" height="152" rx="16" fill="url(#scr3)"/>
    <rect x="1043" y="418" width="34" height="9" rx="4.5" fill="#0F172A" fill-opacity="0.85"/>
    <rect x="1032" y="444" width="56" height="40" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="1032" y="498" width="34" height="30" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#F8FAFC" stroke-opacity="0.7" stroke-width="1.2"/>

    <!-- slot badges -->
    <g font-size="14" font-weight="700" fill="#0B1220">
      <circle cx="753" cy="592" r="13" fill="#818CF8"/><text x="753" y="597" text-anchor="middle">1</text>
      <circle cx="906" cy="596" r="13" fill="#A78BFA"/><text x="906" y="601" text-anchor="middle">2</text>
      <circle cx="1060" cy="592" r="13" fill="#22D3EE"/><text x="1060" y="597" text-anchor="middle">3</text>
    </g>
  </g>
</svg>
