<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system,'SF Pro Display','Segoe UI','Noto Sans Thai','Leelawadee UI',Thonburi,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="aurora" x1="108" y1="150" x2="430" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blob" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B1220"/>
  <circle cx="180" cy="-40" r="280" fill="#6366F1" opacity="0.20" filter="url(#blob)"/>
  <circle cx="1160" cy="700" r="300" fill="#06B6D4" opacity="0.16" filter="url(#blob)"/>

  <!-- brand row -->
  <g transform="translate(80,56) scale(0.117)">
    <rect width="512" height="512" rx="116" fill="#1E1B4B"/>
    <g filter="url(#glow)" opacity="0.65">
      <rect x="108" y="144" width="208" height="132" rx="6" fill="url(#aurora)"/>
      <rect x="340" y="186" width="90" height="190" rx="14" fill="url(#aurora)"/>
    </g>
    <path d="M212,304 C212,368 300,402 340,402 C368,402 386,400 386,388" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
    <rect x="96" y="132" width="232" height="156" rx="14" fill="#E2E8F0"/>
    <rect x="108" y="144" width="208" height="132" rx="6" fill="url(#aurora)"/>
    <rect x="76" y="288" width="272" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="330" y="176" width="110" height="210" rx="22" fill="#E2E8F0"/>
    <rect x="340" y="186" width="90" height="190" rx="14" fill="url(#aurora)"/>
  </g>
  <text x="156" y="96" font-size="28" font-weight="600" fill="#E2E8F0">AEasy Display</text>

  <!-- headline -->
  <text x="80" y="230" font-size="52" font-weight="800" fill="#F8FAFC">มือถือหรือ tablet Android</text>
  <text x="80" y="296" font-size="52" font-weight="800" fill="url(#accent)">กลายเป็นจอสัมผัสของ Mac</text>

  <!-- subline -->
  <text x="80" y="356" font-size="24" fill="#94A3B8">เสียบสาย USB-C หรือต่อ Wi-Fi — แตะจอเพื่อคลิก</text>
  <text x="80" y="392" font-size="24" fill="#94A3B8">ลากหน้าต่างได้เลย แสดงพร้อมกันได้ถึง 3 panes</text>

  <!-- pills -->
  <g font-size="19" fill="#CBD5E1">
    <rect x="80" y="440" width="150" height="44" rx="22" fill="#131C2E" stroke="#334155"/>
    <text x="155" y="468" text-anchor="middle">แตะสั่งงานได้</text>
    <rect x="246" y="440" width="160" height="44" rx="22" fill="#131C2E" stroke="#334155"/>
    <text x="326" y="468" text-anchor="middle">USB หรือ Wi-Fi</text>
    <rect x="422" y="440" width="186" height="44" rx="22" fill="#131C2E" stroke="#334155"/>
    <text x="515" y="468" text-anchor="middle">3 panes พร้อมกัน</text>
  </g>

  <text x="80" y="576" font-size="19" fill="#64748B">macOS 13+ · Android 8+ · H.264/HEVC ฮาร์ดแวร์ · ฟรี โอเพนซอร์ส</text>

  <!-- illustration -->
  <g transform="translate(620,40) scale(1.32)">
    <g filter="url(#glow)" opacity="0.6">
      <rect x="108" y="144" width="208" height="132" rx="6" fill="url(#aurora)"/>
      <rect x="340" y="186" width="90" height="190" rx="14" fill="url(#aurora)"/>
    </g>
    <path d="M212,304 C212,368 300,402 340,402 C368,402 386,400 386,388" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
    <circle cx="238" cy="382" r="4.5" fill="#22D3EE"/>
    <circle cx="304" cy="399" r="4.5" fill="#22D3EE"/>
    <!-- wireless option -->
    <g transform="translate(296,338)" stroke="#22D3EE" fill="none" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M-14,-4 a20,20 0 0 1 28,0"/>
      <path d="M-8,3 a11,11 0 0 1 16,0"/>
      <circle cx="0" cy="9" r="2.5" fill="#22D3EE" stroke="none"/>
    </g>
    <rect x="96" y="132" width="232" height="156" rx="14" fill="#E2E8F0"/>
    <rect x="108" y="144" width="208" height="132" rx="6" fill="url(#aurora)"/>
    <rect x="76" y="288" width="272" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="190" y="288" width="44" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="330" y="176" width="110" height="210" rx="22" fill="#E2E8F0"/>
    <rect x="340" y="186" width="90" height="190" rx="14" fill="url(#aurora)"/>
    <circle cx="385" cy="198" r="3.5" fill="#0F172A" fill-opacity="0.55"/>
    <!-- floating panes on the phone -->
    <g>
      <rect x="347" y="246" width="48" height="36" rx="4" fill="#0F172A" fill-opacity="0.55" stroke="#F8FAFC" stroke-opacity="0.75" stroke-width="1.5"/>
      <rect x="347" y="246" width="48" height="6" rx="3" fill="#F8FAFC" fill-opacity="0.35"/>
      <rect x="369" y="292" width="54" height="42" rx="4" fill="#0F172A" fill-opacity="0.55" stroke="#F8FAFC" stroke-opacity="0.75" stroke-width="1.5"/>
      <rect x="369" y="292" width="54" height="6" rx="3" fill="#F8FAFC" fill-opacity="0.35"/>
    </g>
    <!-- touch ripple -->
    <circle cx="376" cy="352" r="9" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9"/>
    <circle cx="376" cy="352" r="3" fill="#22D3EE"/>
  </g>
</svg>
